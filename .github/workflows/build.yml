name: Build

on:
  push:
    branches: ["**"]
    tags: ["v*", "[0-9]*"]
  release:
    types: [published]
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Attach the built files to this existing release (its tag, e.g. 1.1.0). Leave empty to only build."
        required: false
        default: ""

permissions:
  contents: write

env:
  SPT_ARCHIVE: https://github.com/sp-tarkov/build/releases/download/4.0.13/SPT-4.0.13-40087-2891fd4.7z
  AP_VERSION: "0.6.4"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download SPT 4.0.13 (reference assemblies)
        run: |
          curl -fsSL -o spt.7z "$SPT_ARCHIVE"
          7z x -ospt spt.7z > /dev/null

      - name: Unity reference assemblies for the client plugin
        uses: actions/checkout@v4
        with:
          repository: cebarks/spt-assemblies
          # a commit with the reference DLLs committed (Unity modules are the same for SPT 4.0.13)
          ref: 7bbeda287d63a6260c45c04963c7ee600032987a
          path: unity-refs

      - name: Build the server mod
        run: dotnet build server-mod/ArchipelagoTarkov -c Release -p:SptPath="$GITHUB_WORKSPACE/spt"

      - name: Build the client plugin
        run: |
          mkdir -p client-refs
          cp spt/BepInEx/core/BepInEx.dll spt/BepInEx/plugins/spt/spt-common.dll client-refs/
          for f in UnityEngine.dll UnityEngine.CoreModule.dll UnityEngine.JSONSerializeModule.dll; do
            cp "unity-refs/src/SPT.ReferenceAssemblies/ref/net472/$f" client-refs/
          done
          dotnet build client-plugin/ArchipelagoTarkov.Client -c Release -p:SptPath="$GITHUB_WORKSPACE/client-refs"

      - name: Archipelago ${{ env.AP_VERSION }}
        run: |
          git clone --depth 1 --branch "$AP_VERSION" https://github.com/ArchipelagoMW/Archipelago.git ap
          python -m pip install -r ap/requirements.txt pytest
          cp -r apworld/tarkov ap/worlds/tarkov

      - name: APWorld tests
        working-directory: ap
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          python -m pytest worlds/tarkov/test -q
          # a full generation with the default options and with the Collector goal
          mkdir -p ci-players
          printf 'name: Runner\ngame: Escape from Tarkov\nEscape from Tarkov: {}\n' > ci-players/a.yaml
          printf 'name: Kappa\ngame: Escape from Tarkov\nEscape from Tarkov:\n  goal: collector\n  death_link: true\n' > ci-players/b.yaml
          python Generate.py --player_files_path ci-players --outputpath ci-out < /dev/null
          ls ci-out/*.zip

      - name: Build tarkov.apworld and the YAML template
        working-directory: ap
        env:
          SKIP_REQUIREMENTS_UPDATE: "1"
        run: |
          find worlds/tarkov -name __pycache__ -prune -exec rm -rf {} +
          # (--skip_open_folder only exists in newer Archipelago versions)
          PYTHONDONTWRITEBYTECODE=1 python Launcher.py "Build APWorlds" -- "Escape from Tarkov" --skip_open_folder < /dev/null \
            || PYTHONDONTWRITEBYTECODE=1 python Launcher.py "Build APWorlds" -- "Escape from Tarkov" < /dev/null || true
          test -f build/apworlds/tarkov.apworld
          python -c "import Options; Options.generate_yaml_templates('templates', False)"

      - name: Package
        run: |
          VERSION=$(python -c "import json; print(json.load(open('apworld/tarkov/archipelago.json'))['world_version'])")
          mkdir -p dist stage/SPT/user/mods/ArchipelagoTarkov stage/BepInEx/plugins/ArchipelagoTarkov
          cp server-mod/ArchipelagoTarkov/bin/Release/ArchipelagoTarkov.dll stage/SPT/user/mods/ArchipelagoTarkov/
          cp client-plugin/ArchipelagoTarkov.Client/bin/Release/ArchipelagoTarkov.Client.dll stage/BepInEx/plugins/ArchipelagoTarkov/
          (cd stage && zip -r "../dist/ArchipelagoTarkov-$VERSION-SPT-4.0.13.zip" SPT BepInEx)
          cp ap/build/apworlds/tarkov.apworld dist/
          cp "ap/templates/Escape from Tarkov.yaml" dist/

      - uses: actions/upload-artifact@v4
        with:
          name: archipelago-tarkov
          path: dist/

      # Publishing a release (any tag), pushing a version tag, or running this workflow by hand with a
      # release tag attaches the files above to that release. The release's own title and notes are kept.
      - name: Attach the files to the release
        if: github.event_name == 'release' || startsWith(github.ref, 'refs/tags/') || inputs.release_tag
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.event.release.tag_name || github.ref_name }}
          files: dist/*
          fail_on_unmatched_files: true
